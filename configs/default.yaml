data:
  num_samples: 100
  random_state: 42
  missing_charges_count: 5
  raw_data_path: null

preprocessing:
  target_column: "Churn Label"
  id_column: "customerID"

clustering:
  n_clusters: 4
  elbow_k_max: 6
  random_state: 42

modeling:
  test_size: 0.2
  random_state: 42
  param_dist:
    n_estimators: [50, 100, 150]
    max_depth: [null, 10, 20]
    min_samples_split: [2, 5]
  n_iter: 5
  cv: 3

output:
  artifacts_dir: "artifacts"
