data:
  num_samples: 100
  random_state: 42
  missing_charges_count: 5
  raw_data_path: null

validation:
  enabled: true
  min_tenure: 0
  max_tenure: 120
  min_monthly_charges: 0.0
  max_monthly_charges: 500.0

feature_engineering:
  enabled: true
  create_ratios: true
  create_contract_risk: true

sampling:
  use_smote_nc: true
  random_state: 42

preprocessing:
  target_column: "Churn Label"
  id_column: "customerID"

clustering:
  n_clusters: 4
  elbow_k_max: 6
  random_state: 42

modeling:
  test_size: 0.2
  random_state: 42
  param_dist:
    n_estimators: [50, 100, 150]
    max_depth: [null, 10, 20]
    min_samples_split: [2, 5]
  n_iter: 5
  cv: 3

output:
  artifacts_dir: "artifacts"
